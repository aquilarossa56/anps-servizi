<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0a2f6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ANPS Servizi">
<title>ANPS Milano – Servizi Volontari</title>
<style>
:root{--bg:#f4f6fa;--c:#fff;--t:#14213d;--m:#5b6785;--p:#0a2f6b;--az:#2f8fd8;--pt:#fff;--a:#d9a400;--b:#dde3ee;--hl:#dbe7ff;--rd:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1424;--c:#18213a;--t:#e8ecf6;--m:#9aa6c4;--p:#5b8def;--pt:#0e1424;--b:#2a3556;--hl:#22335f}}
:root[data-theme=dark]{--bg:#0e1424;--c:#18213a;--t:#e8ecf6;--m:#9aa6c4;--p:#5b8def;--pt:#0e1424;--b:#2a3556;--hl:#22335f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{border-bottom:4px solid var(--az);background:var(--p);color:var(--pt);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
header img{height:52px;margin-right:10px}.hl{display:flex;align-items:center}header h1{font-size:16px;margin:0}header small{opacity:.85}
main{max-width:980px;margin:0 auto;padding:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 10px}
button,select,input{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:8px;padding:8px 10px;max-width:100%}
button{cursor:pointer}button.pri{background:var(--p);color:var(--pt);border-color:var(--p)}
button.del{color:var(--rd)}
nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}nav button.on{background:var(--p);color:var(--pt)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:var(--m)}
.day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid transparent;cursor:default;position:relative}
.day.has{background:var(--p);color:var(--pt);font-weight:700;cursor:pointer}
.day.prog{background:#e67e22;color:#fff;font-weight:700;cursor:pointer}.day.both::after{content:'';position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:#e67e22;border:1px solid #fff}.day u{position:absolute;bottom:3px;display:flex;gap:2px;text-decoration:none}.day u b{width:7px;height:7px;border-radius:50%;border:1px solid #fff}.srv+.oh{margin-top:14px}.oh{background:#e67e22;color:#fff;font-weight:700;font-size:16px;padding:9px 14px;border-radius:8px;margin:0 0 10px}.card>.oh:first-child{margin:-14px -14px 12px;border-radius:12px 12px 0 0}.rt .rv{flex:0 0 112px}.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--m)}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.day.pc{color:#fff;text-shadow:0 0 3px #000,0 0 3px #000,0 0 2px #000}
.day.today{border-color:var(--a)}.day.sel{outline:3px solid var(--a)}
.day.has i{position:absolute;bottom:3px;font-size:9px;font-style:normal}
.cal{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:720px){.two{grid-template-columns:1fr}}
.srv{border:1px solid var(--b);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--hl)}
.srv b{display:block}.m{color:var(--m);font-size:13px}
.tag{display:inline-block;background:var(--p);color:var(--pt);border-radius:99px;padding:1px 9px;font-size:12px;margin:2px 3px 2px 0}
.tag a{color:inherit;text-decoration:none;font-weight:700;margin-left:3px}.tag.r{background:var(--a);color:#14213d;font-weight:700}
ol{padding-left:20px;margin:6px 0}li.r{font-weight:700;color:var(--a)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f label{display:flex;flex-direction:column;font-size:13px;color:var(--m);gap:3px}.f .w{grid-column:1/-1}.rt{display:flex;gap:8px;flex-wrap:wrap}.rt .rr{flex:1 1 170px}.rt .rh{flex:0 0 130px}.rt .rn{flex:0 0 150px}.rt .rb{flex:0 0 150px}.rt .rb .m{white-space:nowrap;font-size:12px}.rt input:disabled{opacity:.55}.f label{min-width:0}.f input,.f select{width:100%;min-width:0}#fv,#fc,#evp,#pv{width:auto;max-width:100%}.rt{min-width:0}
.tw{overflow-x:auto}.tw.big{max-height:68vh;overflow:auto}.ar{border:1px solid #8884;border-radius:10px;margin:6px 0;background:var(--c)}.arh{padding:9px 10px;cursor:pointer;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}.arh:hover{background:var(--hl)}.pill{border-radius:99px;padding:1px 9px;color:#fff;font-size:12px;font-weight:700;white-space:nowrap}.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}.agrid label{display:block;font-size:13px}.agrid input,.agrid select{width:100%;box-sizing:border-box}.xl2 .mr{cursor:pointer}.xl2 .mr:hover{background:var(--hl)}.xl2{font-size:13px}.xl2 td,.xl2 th{white-space:normal;padding:6px 5px}.xl2 .dt td{background:rgba(120,140,190,.10);padding:10px 12px}.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.xl2 th{position:sticky;top:0;background:var(--c);z-index:1;border-bottom:2px solid var(--p)}.xl2 tbody tr.mr:nth-child(odd){background:rgba(120,140,190,.06)}.xl2 tr.fut td{color:var(--m)}.xl2 tfoot td{position:sticky;bottom:0;background:var(--hl)}.xl th{position:sticky;top:0;background:var(--c);z-index:1;border-bottom:2px solid var(--p)}.xl tbody tr:nth-child(even){background:rgba(120,140,190,.08)}.xl tr.fut td{color:var(--m)}.xl tfoot td{position:sticky;bottom:0;background:var(--hl)}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--b);white-space:nowrap}
.bar{height:10px;background:var(--p);border-radius:5px}
.nb{background:rgba(242,194,0,.2);border-left:4px solid #f2c200;border-radius:6px;padding:8px 10px;margin:8px 0}.f textarea{width:100%;min-width:0;font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:8px;padding:8px 10px;resize:vertical}
.gp{color:#2e9e3f;font-weight:700}.rm{color:#e04545;font-weight:700}.tot{display:flex;gap:6px 22px;flex-wrap:wrap;font-size:18px}.rs{cursor:pointer}.rs td{vertical-align:top}.ed td{background:var(--c);border-bottom:2px solid var(--p)}.ed .f{padding:8px 0;max-width:780px;grid-template-columns:1fr 1fr 1fr}.ed label{font-size:12px}
.sub td{background:var(--hl);font-size:13px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}@media(max-width:720px){.three{grid-template-columns:1fr}}.cb{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px}.sv text{fill:var(--t);font-size:11px}.cb2{background:#0a2f6b;color:#fff;border-radius:10px;padding:10px;display:flex;gap:6px 22px;flex-wrap:wrap;margin-top:8px}
.pk label{display:flex;flex-direction:column;font-size:13px;color:var(--m);gap:3px}.pk label.pkd{flex-direction:row;align-items:center;gap:5px;color:var(--t);border:1px solid var(--b);border-radius:8px;padding:3px 9px;background:var(--c)}.pk .pkl{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.pk table td{white-space:normal;vertical-align:top}.pk tr.off td{opacity:.4}.pk .sec{margin:12px 0 6px;font-weight:700;color:var(--p)}.pk textarea{width:100%;min-width:0;font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:8px;padding:8px 10px}.pk input[type=text],.pk input:not([type]),.pk input[type=date],.pk input[type=time],.pk input[type=number],.pk select{width:100%;min-width:0}
.vr{cursor:pointer;padding:5px 0}.vd{background:var(--hl);border-radius:8px;padding:6px 10px;margin:2px 0 8px}.vd table{font-size:14px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}.dot.y{background:#f2c200}.dot.r{background:#d32f2f}.lowbox{background:var(--hl);border:1px solid var(--b);border-radius:10px;padding:10px;margin-bottom:10px}.chip{display:inline-block;border:1px solid var(--b);background:var(--c);border-radius:99px;padding:2px 10px;margin:3px 5px 3px 0}
.vt{background:var(--hl);border:1px solid var(--b);border-radius:8px;padding:8px 12px;white-space:nowrap}.vt b{font-size:16px}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.login{text-align:center;max-width:420px;margin:40px auto}.login button{margin:4px}
</style></head><body>

let noKeep=false;function draw(){const sv={},ae=document.activeElement&&document.activeElement.id,nk=noKeep;noKeep=false;document.querySelectorAll('[id^="a_"],[id^="c_"]').forEach(x=>sv[x.id]=x.value);draw1();if(!nk){for(const k in sv){const x=document.getElementById(k);if(x&&x.value!==sv[k])x.value=sv[k]}if(ae){const x=document.getElementById(ae);if(x&&x.focus)x.focus()}}}

function draw0(){if(!user)return login();if(isAdm()){freezePast();yrAutoRun()}if(user==='__pick')return pick();

const tabs=[['cal','Calendario']].concat(isAdm()?[['nsrv','Nuovo servizio'],['ndef','Da definire'],['ninc','Nuovo incontro'],['old','Vecchio servizio'],['stat','Statistiche'],['conf','Confronto anno'],['conv','Convenzioni'],['parchi','Servizi Parchi'],['vol','Volontari'],['ana','Anagrafica Volontari']]:[]);

if(tab!=='stat')showAll=false;if(tab!=='nsrv'&&tab!=='old')backAll=null;if(!isAdm())tab='cal';if(tab==='old'){if(!draft.old)draft={vols:[],old:true}}else{oldMsg='';if(draft.old)draft={vols:[]}};$('#v').innerHTML=tab==='cal'?cal():tab==='nsrv'?form():tab==='ndef'?formP():tab==='ninc'?formE():tab==='old'?form():tab==='stat'?stat():tab==='conf'?confr():tab==='conv'?convP():tab==='parchi'?parchiP():tab==='ana'?anaP():volp()}
function cal(){const y=month.getFullYear(),m=month.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
const fut=S.srv.filter(s=>s.d>=today);let cells='';
for(let i=0;i<first;i++)cells+='<div></div>';
for(let d=1;d<=n;d++){const k=iso(new Date(y,m,d)),c=fut.filter(s=>s.d===k).length,pc=S.prog.filter(p=>p.d===k&&p.d>=today).length;
const pcOn=fut.some(s=>s.d===k&&s.type==='Protezione Civile'),ks=[];if(c)ks.push('var(--p)');if(pc)ks.push('#e67e22');S.ev.filter(e=>e.d===k&&e.d>=today).forEach(e=>{if(!ks.includes(EVCOL))ks.push(EVCOL)});
cells+=`<div class="day ${ks.length?'has':''} ${pcOn?'pc':''} ${k===today?'today':''} ${k===sel?'sel':''}" ${ks.length?`style="background:${pcOn?`url(${PCL}) center/contain no-repeat`:ks[0]}" onclick="sel='${k}';draw()"`:''}>${d}${c>1?`<i>${c}</i>`:''}${ks.length>1?`<u>${ks.slice(1).map(x=>`<b style="background:${x}"></b>`).join('')}</u>`:''}</div>`}
const list=sel?fut.filter(s=>s.d===sel):[];
const mine=!isAdm()?fut.filter(s=>s.vols.includes(user)).sort((a,b)=>a.d.localeCompare(b.d)):[];
return `${remind()}<div class="two"><div class="card"><div class="cal"><button onclick="month=new Date(${y},${m-1},1);draw()">‹</button><b>${MESI[m]} ${y}</b><button onclick="month=new Date(${y},${m+1},1);draw()">›</button></div>
<div class="grid">${['L','M','M','G','V','S','D'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div>
<div class="lg"><span><i style="background:var(--p)"></i>Servizio confermato</span><span><img src="${PCL}" style="width:14px;height:14px;vertical-align:-2px;margin-right:5px">Protezione Civile</span><span><i style="background:#e67e22"></i>Servizio da definire</span><span><i style="background:#58a617"></i>Riunioni e corsi</span></div><p class="m">Clicca su un giorno evidenziato per i dettagli.</p></div>
<div><div class="card">${sel&&!list.length&&(progOn(sel)||evOn(sel))?'':`<h2>${sel?'Servizi del '+fmt(sel):'Seleziona un giorno'}</h2>`}${list.map(card).join('')}${progDay()}${evDay()}${(list.length||progOn(sel)||evOn(sel))?'':'<span class="m">Nessun servizio selezionato.</span>'}</div>
${!isAdm()?`<div class="card"><h2>I miei prossimi servizi</h2>${mine.map(s=>`<div class="srv"><b>${fmt(s.d)} · N. ${numOf(s)}/${s.d.slice(0,4)} · ${s.from}–${s.to}</b>${esc(s.ev||s.place)} · ${esc(s.type)}</div>`).join('')||'<span class="m">Nessun servizio assegnato.</span>'}</div>`:''}</div></div>${progBox()}${isAdm()?reg():''}`}
function card(s){return `<div class="srv"><b style="font-size:17px">📅 ${fmt(s.d)} · Ord. N. ${numOf(s)}/${s.d.slice(0,4)}</b><b>${s.from}–${s.to} · ${esc(s.type)}</b>${esc(s.ev)}<div class="m">📍 ${esc(s.place)} · Ritrovo: ${esc(s.rit)}${s.oraRit?' · <strong>ore '+esc(s.oraRit)+'</strong>':''}${s.cars&&s.cars.length?' · 🚗 '+esc(s.cars.join(', ')):''}${isAdm()&&s.rimb&&s.type!=='Protezione Civile'?' · 💶 '+eur(s.rimb)+' per ogni volontario':''}${isAdm()&&ctOf(s)&&s.type!=='Protezione Civile'?' · 💰 contributo '+eur(ctOf(s))+' per volontario'+(lkS(s)?' (da convenzione)':''):''}</div>
<ol>${s.vols.map((v,i)=>`<li class="${i?'':'r'}">${esc(v)}${i?'':' — <span class="tag r">Responsabile</span>'}</li>`).join('')}</ol>${noteBox(s.note)}
${isAdm()||(s.vols.includes(user)&&s.d===today)?`<button class="pri" onclick="ord(${s.id})">📄 Scarica ordinanza PDF</button>`:''} ${isAdm()?`<button onclick="mail(${s.id})">✉️ Email</button> <button onclick="editSrv(${s.id})">✏️ Modifica</button> <button onclick="wa(${s.id})">💬 WhatsApp</button> <button class="del" onclick="delSrv(${s.id})">Elimina</button>`:''}</div>`}
function form(){const d=draft;if(d.t===undefined){d.t=TIPI[0];const n=DEFS[d.t]||{};for(const k of ['p','q','rb','e'])if(d[k]===undefined)d[k]=n[k]||''}const sl=(a,v)=>a.map(t=>`<option ${t===v?'selected':''}>${t}</option>`).join('');const yd=(()=>{const t=new Date();t.setDate(t.getDate()-1);return iso(t)})();return `<div class="card" id="frm" ${d.old?'style="border:2px solid #7a5c00"':''}><h2>${d.old?'Vecchio servizio (già svolto)':d.id?'Modifica servizio':'Nuovo servizio'}</h2>${d.old?'<div class="m" style="margin-bottom:8px">🕘 Per inserire un servizio già svolto o comunicato in ritardo. Non prende un numero di ordinanza e non cambia la numerazione degli altri servizi. Compare nel Registro servizi e nelle statistiche.</div>'+(oldMsg?'<div class="nb">'+oldMsg+'</div>':''):''}${d.fromProg?'<div class="m" style="margin-bottom:8px">➡️ Dati presi dal servizio da definire: completa e salva. Il servizio da definire verrà tolto dall\'elenco.</div>':''}<div class="f">

return `<div class="card" style="border:2px solid var(--a)"><h2>🔔 Promemoria servizio <button onclick="beep()">🔊 Riascolta bip</button></h2>${L.map(s=>`<div><b>${s.d===today?'OGGI':'DOMANI'}</b> ${fmt(s.d)} · ${s.from}–${s.to} · ${esc(s.type)} · ${esc(s.place)} · Ritrovo: ${esc(s.rit)}</div>`).join('')}</div>`}
/* ===== Firebase / dati ===== */
const CFG=window.FIREBASE_CONFIG&&!/^INCOLLA/.test(window.FIREBASE_CONFIG.apiKey||'INCOLLA')?window.FIREBASE_CONFIG:null;
const ADMINS=(window.ADMIN_EMAILS||[]).map(x=>x.toLowerCase());
let db=null,auth=null,un=[];const vid=n=>n.replace(/\//g,'-');
function put(s){if(db)db.collection('servizi').doc(String(s.id)).set(s).catch(e=>alert(e.message));else{const i=S.srv.findIndex(x=>x.id===s.id);i<0?S.srv.push(s):S.srv[i]=s;save();draw()}}
function rm(id){if(db)db.collection('servizi').doc(String(id)).delete();else{S.srv=S.srv.filter(s=>s.id!==id);save();draw()}}
function putV(n,e){e=e||(S.mail||{})[n]||'';const nu=!S.vol.includes(n),sn=nu?today:((S.since||{})[n]||null);if(db)db.collection('volontari').doc(vid(n)).set({name:n,email:e,since:sn});else{if(nu)S.vol.push(n);(S.mail=S.mail||{})[n]=e;(S.since=S.since||{})[n]=sn;S.vol.sort();save();draw()}}
function rmV(n){if(db)db.collection('volontari').doc(vid(n)).delete();else{S.vol=S.vol.filter(x=>x!==n);save();draw()}}
function out(){if(auth)auth.signOut();else{user=null;draw()}}
function login(){if(!CFG)return demoLogin();$('#who').innerHTML='';$('#app').innerHTML=`<div class="card login"><img src="${document.querySelector('header img').src}" height="110" alt="ANPS"><h2>Accesso</h2>
<input id="em" type="email" placeholder="Email"><br><br><input id="pw" type="password" placeholder="Password (min. 6 caratteri)"><br>
<button class="pri" onclick="au('in')">Accedi</button><button onclick="au('up')">Registrati</button><br><a href="#" onclick="au('rs');return false">Password dimenticata?</a>
<p class="m">Prima volta? Premi Registrati, poi scegli il tuo nominativo.</p></div>`}
async function au(m){const e=$('#em').value.trim(),p=$('#pw').value;try{if(m==='in')await auth.signInWithEmailAndPassword(e,p);else if(m==='up')await auth.createUserWithEmailAndPassword(e,p);else{await auth.sendPasswordResetEmail(e);alert('Ti ho inviato una email per reimpostare la password')}}catch(x){alert(errIt(x))}}
const ERR_IT={'auth/email-already-in-use':"Questa email è già registrata.\n\nNon devi registrarti di nuovo: premi «Accedi». Se non ricordi la password, premi «Password dimenticata?».",'auth/invalid-email':"L'indirizzo email non è scritto correttamente. Controlla che contenga la @ (esempio: nome@gmail.com).",'auth/missing-email':"Scrivi la tua email.",'auth/missing-password':"Scrivi la password.",'auth/weak-password':"La password è troppo corta: servono almeno 6 caratteri.",'auth/user-not-found':"Non esiste un account con questa email. Se è la prima volta, premi «Registrati».",'auth/wrong-password':"Password errata. Riprova oppure premi «Password dimenticata?».",'auth/invalid-credential':"Email o password non corretti. Se è la prima volta premi «Registrati», altrimenti prova «Password dimenticata?».",'auth/too-many-requests':"Troppi tentativi. Aspetta qualche minuto e riprova.",'auth/network-request-failed':"Nessuna connessione a internet. Controlla la rete e riprova.",'auth/user-disabled':"Questo account è stato disattivato. Contatta l'amministratore.",'auth/unauthorized-domain':"Questo sito non è autorizzato in Firebase. L'amministratore deve aggiungerlo tra i Domini autorizzati."};
const errIt=x=>ERR_IT[x.code]||'Si è verificato un errore ('+(x.code||x.message)+'). Riprova o contatta l\'amministratore.';
function pick(){$('#who').innerHTML='<button onclick="out()">Esci</button>';$('#app').innerHTML=`<div class="card login"><h2>Chi sei?</h2><p class="m">Scegli il tuo nominativo. Se non compare, chiedi all'amministratore di inserirti.</p><select id="pk"><option value="">—</option>${S.vol.map(v=>`<option>${esc(v)}</option>`).join('')}</select><button class="pri" onclick="pk()">Conferma</button></div>`}
async function pk(){const n=$('#pk').value;if(!n)return;await db.collection('users').doc(auth.currentUser.uid).set({name:n,email:auth.currentUser.email});user=n;draw()}
function listen(){un.forEach(f=>f());un=[db.collection('servizi').onSnapshot(q=>{if($('#frm'))keep(true);S.srv=q.docs.map(x=>x.data());draw()}),isAdm()?db.collection('anagrafica').onSnapshot(q=>{S.ana={};q.docs.forEach(x=>{S.ana[x.data().name]=x.data()});draw()}):()=>{},isAdm()?db.collection('telefoni').onSnapshot(q=>{S.tel={};q.docs.forEach(x=>{S.tel[x.data().name]=x.data().tel||''});draw()}):()=>{},isAdm()?db.collection('convenzioni').onSnapshot(q=>{if($('#frmC'))keepC();S.conv=q.docs.map(x=>x.data());draw()}):()=>{},db.collection('eventi').onSnapshot(q=>{if($('#frmE'))keepE(true);S.ev=q.docs.map(x=>x.data());draw()}),db.collection('programmazione').onSnapshot(q=>{if($('#frmP'))keepP(true);S.prog=q.docs.map(x=>x.data());draw()}),db.collection('volontari').onSnapshot(q=>{if($('#frm'))keep(true);S.mV={};S.since={};q.docs.forEach(x=>{S.mV[x.data().name]=x.data().email||'';S.since[x.data().name]=x.data().since||null});mergeMail();S.vol=q.docs.map(x=>x.data().name).sort();draw()})];if(isAdm())un.push(db.collection('users').onSnapshot(q=>{S.mU={};q.docs.forEach(x=>{const u=x.data();S.mU[u.name]=u.email});mergeMail();draw()}))}
function mergeMail(){S.mail=Object.assign({},S.mU||{});Object.entries(S.mV||{}).forEach(([k,v])=>{if(v)S.mail[k]=v})}
async function boot(){if(!CFG)return draw();
try{for(const u of ['app','auth','firestore'])await lib('https://www.gstatic.com/firebasejs/10.12.2/firebase-'+u+'-compat.js')}catch(e){return alert('Impossibile caricare Firebase')}
firebase.initializeApp(CFG);auth=firebase.auth();db=firebase.firestore();S={vol:[],srv:[],mail:{},prog:[],ev:[],conv:[]};
auth.onAuthStateChanged(async u=>{if(!u){un.forEach(f=>f());un=[];user=null;return draw()}
if(ADMINS.includes(u.email.toLowerCase()))user='__admin';else{const d=await db.collection('users').doc(u.uid).get();user=d.exists?d.data().name:'__pick'}
listen();draw()})}

function rbT(){$('#rbt').textContent=rbTxt($('#frb').value,draft.vols.length)}

function ordRows(s){return [['Servizio',s.type+(s.ev?' - '+s.ev:'')],['Data del servizio',fmt(s.d)],['Orario','dalle ore '+s.from+' alle ore '+s.to],['In località',s.place||'-'],['Su richiesta di',s.req||'-'],['Punto di ritrovo',s.rit+(s.oraRit?' - ore '+s.oraRit:'')]]}
function reg(){const y=today.slice(0,4),L=S.srv.filter(s=>s.d.startsWith(y)&&!s.man).sort((a,b)=>numOf(a)-numOf(b)||(lt(a,b)?-1:1));return `<div class="card" id="reg"><h2>Registro ordinanze ${y}</h2><div class="tw"><table><tr><th>Ord. N.</th><th>Data</th><th>Orario</th><th>Tipo</th><th>Località</th></tr>${L.map(s=>`<tr><td><b>${numOf(s)}/${y}</b>${s.n?' 🔒':''}</td><td><b>${fmt(s.d)}</b></td><td>${s.from}–${s.to}</td><td>${esc(s.type)}</td><td>${esc(s.place)}</td></tr>`).join('')||'<tr><td colspan=5 class=m>Nessun servizio</td></tr>'}</table></div><div class="m">🔒 = numero bloccato (servizio già svolto o in corso)</div></div>`}
function admRem(){const L=[];for(const n of [2,1]){const t=new Date();t.setDate(t.getDate()+n);S.srv.filter(s=>s.d===iso(t)).sort((x,y)=>x.from.localeCompare(y.from)).forEach(s=>L.push([n,s]))}const LE=[];for(const n of [2,1]){const t=new Date();t.setDate(t.getDate()+n);S.ev.filter(e=>e.d===iso(t)).sort((x,y)=>(x.h||'').localeCompare(y.h||'')).forEach(e=>LE.push([n,e]))}if(!L.length&&!LE.length)return'';return `<div class="card" style="border:2px solid var(--a)"><h2>🔔 Promemoria da inviare ai volontari</h2><div class="m" style="margin-bottom:6px">Un solo messaggio a tutti i volontari del servizio, con le indicazioni.</div>${L.map(([n,s])=>`<div class="srv" style="margin:6px 0"><b>${n===2?'Tra 2 giorni (dopodomani)':'Domani'} · ${fmt(s.d)} · ${s.from}–${s.to}</b>${esc(s.type)} · ${esc(s.ev||s.place)}<div class="m">📍 ${esc(s.place)} · Ritrovo: ${esc(s.rit)} · 👥 ${s.vols.length} volontari</div><button class="pri" onclick="wa(${s.id})">💬 WhatsApp (scheda con logo)</button> <button class="pri" onclick="mailRem(${s.id})">✉️ Email a tutti</button> <button onclick="ord(${s.id})">📄 Ordinanza PDF</button><div class="m" style="margin-top:8px">Oppure chat diretta con un volontario (solo testo):</div><div>${s.vols.map((v,i)=>`<button class="${(S.tel||{})[v]?'':'nt'}" onclick="waOne(${s.id},${i})" style="margin:2px 4px 2px 0">💬 ${esc(v)}${(S.tel||{})[v]?'':' ⚠️'}</button>`).join('')}</div></div>`).join('')}${LE.map(([n,e])=>`<div class="srv" style="margin:6px 0;border-left:5px solid ${EVCOL}"><b>${n===2?'Tra 2 giorni (dopodomani)':'Domani'} · ${fmt(e.d)}${e.h?' · '+e.h+(e.h2?'–'+e.h2:''):''}</b>${esc(e.t)}${e.m?' · '+esc(e.m):''}<div class="m">📍 ${esc(e.p)} · 👥 ${e.all?'tutti i volontari ('+S.vol.length+')':evPart(e).length+' partecipanti'}</div><button class="pri" onclick="shareCardE(${e.id},true)">💬 WhatsApp (scheda con logo)</button> <button class="pri" onclick="mailRemE(${e.id})">✉️ Email</button>${e.all?'<div class="m" style="margin-top:6px">Incontro per tutti: invia la scheda nel gruppo dei volontari.</div>':`<div class="m" style="margin-top:8px">Oppure chat diretta con un partecipante (solo testo):</div><div>${evPart(e).map((v,i)=>`<button class="${(S.tel||{})[v]?'':'nt'}" onclick="waOneE(${e.id},${i})" style="margin:2px 4px 2px 0">💬 ${esc(v)}${(S.tel||{})[v]?'':' ⚠️'}</button>`).join('')}</div>`}</div>`).join('')}</div>`}

<div class="sec">3. Turni del mese: scegli i volontari per ogni giorno e fascia</div><div class="m" style="margin-bottom:4px">Il primo volontario di ogni turno è il Responsabile. Togli la spunta a un giorno per escluderlo; ⬆ copia i volontari dal giorno sopra. Le date passate vengono saltate.</div>
<div class="tw"><table><tr><th>Giorno</th><th>Mattina ${o.fm.on?o.fm.f+'–'+o.fm.t:''}</th><th>Pomeriggio ${o.fp.on?o.fp.f+'–'+o.fp.t:''}</th><th></th></tr>${D.map(x=>`<tr class="${x.on?'':'off'}"><td><label class="pkd"><input type="checkbox" ${x.on?'checked':''} onchange="pkTog('${x.ds}')" style="width:auto"> <b>${WD[x.wd]} ${fmt(x.ds).slice(0,5)}</b>${x.hn?' <span class="m">'+esc(x.hn)+'</span>':''}</label></td>${cell(x.ds,'fm')}${cell(x.ds,'fp')}<td><button onclick="pkCopy('${x.ds}')" title="Copia i volontari dal giorno sopra">⬆</button></td></tr>`).join('')||'<tr><td colspan=4 class="m">Nessun giorno nel mese scelto (o già passato).</td></tr>'}</table></div>
<div class="sec">4. Dati standard (modificabili)</div><div class="rt"><label class="rr">Luogo del servizio<input id="pk_p" value="${esc(o.p)}"></label><label class="rr">Funzioni di Servizio<input id="pk_e" value="${esc(o.e)}"></label></div>
<div class="rt" style="margin-top:6px"><label class="rr">Su richiesta di<input id="pk_q" value="${esc(o.q)}"></label><label class="rh">Rimborso (€)<input type="number" min="0" step="0.01" id="pk_rb" value="${o.rb}"></label><label class="rh">Contributo (€)<input type="number" min="0" step="0.01" id="pk_ct" value="${o.ct}" placeholder="0,00"></label></div>
<label style="margin-top:6px">Note di servizio<textarea id="pk_nt" rows="2" placeholder="Istruzioni supplementari (facoltative)">${esc(o.nt)}</textarea></label>
<div class="sec">5. Ritrovo</div><div class="rt"><label class="rr">Luogo del ritrovo<select id="pk_rit" onchange="pkRe()">${sl(RIT,o.rit)}</select></label><label class="rr"><span>Altro ritrovo</span><input id="pk_ro" value="${esc(o.ro)}" ${o.rit===RIT[2]?'':'disabled placeholder="solo con «Altro…»"'}></label><label class="rh">Minuti prima<input type="number" min="0" step="5" id="pk_min" value="${o.min}" onchange="pkRe()"></label></div>
<div class="m" style="margin:4px 0">Ritrovo: ${F.map(k=>(k==='fm'?'mattina':'pomeriggio')+' ore <b>'+minus(o[k].f||'00:00',+o.min||0)+'</b>').join(' · ')||'—'}</div>
<div style="margin-top:12px"><button class="pri" onclick="pkCreate()" ${tot?'':'disabled'}>Crea ${tot} serviz${tot===1?'io':'i'} Parchi</button> <span class="m">${on.length} giorni · ${vuoti?vuoti+' turni senza volontari (non verranno creati)':'tutti i turni hanno volontari'}</span> <button onclick="pkS=pkInit();pkDone=0;draw()">Azzera</button></div></div>`}
async function pkCreate(){keepK();const o=pkS,D=pkDates().filter(x=>x.on),F=['fm','fp'].filter(k=>o[k].on&&o[k].f&&o[k].t);if(!D.length||!F.length)return alert('Scegli almeno un giorno e una fascia oraria');
const rit=o.rit===RIT[2]?(o.ro||'Altro'):o.rit,list=[];let n=Date.now(),skip=0,vuoti=0;
D.forEach(x=>F.forEach(k=>{const vs=((o.asg[x.ds]||{})[k]||[]);if(!vs.length){vuoti++;return}const f=o[k];if(S.srv.some(s=>s.d===x.ds&&s.from===f.f&&s.type==='Parchi')){skip++;return}list.push({id:n++,d:x.ds,from:f.f,to:f.t,place:o.p,ev:o.e,type:'Parchi',rit,oraRit:minus(f.f,+o.min||0),req:o.q,rimb:+o.rb||0,contr:+o.ct||0,cars:[],note:o.nt||'',vols:[...vs]})}));
if(!list.length)return alert('Nessun servizio da creare: mancano i volontari oppure i servizi sono già presenti.');if(!confirm('Creare '+list.length+' servizi Parchi?'+(skip?' ('+skip+' già presenti, saltati)':'')+(vuoti?' ('+vuoti+' turni senza volontari, saltati)':'')))return;
if(db){try{for(let i=0;i<list.length;i+=400){const b=db.batch();list.slice(i,i+400).forEach(s=>b.set(db.collection('servizi').doc(String(s.id)),s));await b.commit()}}catch(x){return alert('Errore: '+x.message)}}else{S.srv.push(...list);save()}
pkDone=list.length;draw()}
function parchiP(){return formK()}
boot();
</script></body></html>
