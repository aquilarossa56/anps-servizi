<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANPS Milano – Servizi Volontari</title>
<style>
:root{--bg:#f4f6fa;--c:#fff;--t:#14213d;--m:#5b6785;--p:#0a2f6b;--az:#2f8fd8;--pt:#fff;--a:#d9a400;--b:#dde3ee;--hl:#dbe7ff;--rd:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1424;--c:#18213a;--t:#e8ecf6;--m:#9aa6c4;--p:#5b8def;--pt:#0e1424;--b:#2a3556;--hl:#22335f}}
:root[data-theme=dark]{--bg:#0e1424;--c:#18213a;--t:#e8ecf6;--m:#9aa6c4;--p:#5b8def;--pt:#0e1424;--b:#2a3556;--hl:#22335f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{border-bottom:4px solid var(--az);background:var(--p);color:var(--pt);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
header img{height:52px;margin-right:10px}.hl{display:flex;align-items:center}header h1{font-size:16px;margin:0}header small{opacity:.85}
main{max-width:980px;margin:0 auto;padding:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 10px}
button,select,input{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:8px;padding:8px 10px;max-width:100%}
button{cursor:pointer}button.pri{background:var(--p);color:var(--pt);border-color:var(--p)}
button.del{color:var(--rd)}
nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}nav button.on{background:var(--p);color:var(--pt)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:var(--m)}
.day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid transparent;cursor:default;position:relative}
.day.has{background:var(--p);color:var(--pt);font-weight:700;cursor:pointer}
.day.today{border-color:var(--a)}.day.sel{outline:3px solid var(--a)}
.day.has i{position:absolute;bottom:3px;font-size:9px;font-style:normal}
.cal{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:720px){.two{grid-template-columns:1fr}}
.srv{border:1px solid var(--b);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--hl)}
.srv b{display:block}.m{color:var(--m);font-size:13px}
.tag{display:inline-block;background:var(--p);color:var(--pt);border-radius:99px;padding:1px 9px;font-size:12px;margin:2px 3px 2px 0}
.tag.r{background:var(--a);color:#14213d;font-weight:700}
ol{padding-left:20px;margin:6px 0}li.r{font-weight:700;color:var(--a)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f label{display:flex;flex-direction:column;font-size:13px;color:var(--m);gap:3px}.f .w{grid-column:1/-1}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--b);white-space:nowrap}
.bar{height:10px;background:var(--p);border-radius:5px}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.login{text-align:center;max-width:420px;margin:40px auto}.login button{margin:4px}
</style></head><body>

function draw(){if(!user)return login();if(user==='__pick')return pick();
$('#who').innerHTML=`<small>${isAdm()?'Amministratore':esc(user)}</small> <button onclick="out()">Esci</button>`;
const tabs=[['cal','Calendario']].concat(isAdm()?[['stat','Statistiche'],['vol','Volontari']]:[]);
$('#app').innerHTML=`<nav>${tabs.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';draw()">${t[1]}</button>`).join('')}</nav><div id="v"></div>`;
if(!isAdm())tab='cal';$('#v').innerHTML=tab==='cal'?cal():tab==='stat'?stat():volp()}
function cal(){const y=month.getFullYear(),m=month.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
const fut=S.srv.filter(s=>s.d>=today);let cells='';
for(let i=0;i<first;i++)cells+='<div></div>';
for(let d=1;d<=n;d++){const k=iso(new Date(y,m,d)),c=fut.filter(s=>s.d===k).length;
cells+=`<div class="day ${c?'has':''} ${k===today?'today':''} ${k===sel?'sel':''}" ${c?`onclick="sel='${k}';draw()"`:''}>${d}${c>1?`<i>${c}</i>`:''}</div>`}
const list=sel?fut.filter(s=>s.d===sel):[];
const mine=!isAdm()?fut.filter(s=>s.vols.includes(user)).sort((a,b)=>a.d.localeCompare(b.d)):[];
return `${remind()}<div class="two"><div class="card"><div class="cal"><button onclick="month=new Date(${y},${m-1},1);draw()">‹</button><b>${MESI[m]} ${y}</b><button onclick="month=new Date(${y},${m+1},1);draw()">›</button></div>
<div class="grid">${['L','M','M','G','V','S','D'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div>
<p class="m">I giorni evidenziati hanno un servizio. Clicca per i dettagli.</p></div>
<div><div class="card"><h2>${sel?'Servizi del '+fmt(sel):'Seleziona un giorno'}</h2>${list.map(card).join('')||'<span class="m">Nessun servizio selezionato.</span>'}</div>
${!isAdm()?`<div class="card"><h2>I miei prossimi servizi</h2>${mine.map(s=>`<div class="srv"><b>${fmt(s.d)} ${s.from}–${s.to}</b>${esc(s.ev||s.place)} · ${esc(s.type)}</div>`).join('')||'<span class="m">Nessun servizio assegnato.</span>'}</div>`:''}</div></div>${isAdm()?form():''}`}
function card(s){return `<div class="srv"><b>${s.from}–${s.to} · ${esc(s.type)}</b>${esc(s.ev)}<div class="m">📍 ${esc(s.place)} · Ritrovo: ${esc(s.rit)}${isAdm()&&s.rimb?' · 💶 '+eur(s.rimb)+' per ogni volontario':''}</div>
<ol>${s.vols.map((v,i)=>`<li class="${i?'':'r'}">${esc(v)}${i?'':' — <span class="tag r">Responsabile</span>'}</li>`).join('')}</ol>
${isAdm()?`<button onclick="editSrv(${s.id})">✏️ Modifica</button> <button onclick="wa(${s.id})">💬 WhatsApp</button> <button class="del" onclick="delSrv(${s.id})">Elimina</button>`:''}</div>`}
function form(){const d=draft,sl=(a,v)=>a.map(t=>`<option ${t===v?'selected':''}>${t}</option>`).join('');return `<div class="card" id="frm"><h2>${d.id?'Modifica servizio':'Nuovo servizio'}</h2><div class="f">
<label>Data<input type="date" id="fd" value="${d.d||today}" min="${d.id?'':today}"></label>
<label>Tipo di servizio<select id="ft">${sl(TIPI,d.t)}</select></label>
<label>Dalle ore<input type="time" id="ff" value="${d.from||'08:00'}"></label>
<label>Alle ore<input type="time" id="fto" value="${d.to||'13:00'}"></label>
<label>Luogo del servizio<input id="fp" value="${esc(d.p||'')}" placeholder="es. Parco Sempione"></label>
<label>Manifestazione<input id="fe" value="${esc(d.e||'')}" placeholder="es. Festa della Polizia"></label>
<label class="w">Rimborso del servizio (€) – lo stesso importo per ogni volontario partecipante<input type="number" min="0" step="0.01" id="frb" value="${d.rb||''}" placeholder="es. 10,00" oninput="rbT()"><span class="m" id="rbt">${rbTxt(d.rb,d.vols.length)}</span></label>
<label>Ritrovo<select id="fr" onchange="keep()">${sl(RIT,d.r)}</select></label>
<label style="display:${d.r===RIT[2]?'flex':'none'}">Altro ritrovo<input id="fo" value="${esc(d.o||'')}"></label>
<div class="w"><span class="m">Volontari (il primo è il Responsabile)</span><br>
${d.vols.map((v,i)=>`<span class="tag ${i?'':'r'}">${i?'':'★ '}${esc(v)} <a href="#" onclick="keep();draft.vols.splice(${i},1);draw();return false">✕</a></span>`).join('')}
<br><select id="fv"><option value="">+ Aggiungi volontario</option>${S.vol.filter(v=>!d.vols.includes(v)).map(v=>`<option>${esc(v)}</option>`).join('')}</select>
<button onclick="const x=$('#fv').value;keep(true);if(x){draft.vols.push(x);draw()}">Aggiungi</button></div>
<div class="w"><button class="pri" onclick="addSrv()">Salva servizio</button> ${d.id?'<button onclick="draft={vols:[]};draw()">Annulla</button>':''}</div></div></div>`}
function keep(q){const g=i=>$('#'+i)?.value;Object.assign(draft,{d:g('fd'),from:g('ff'),to:g('fto'),p:g('fp'),e:g('fe'),t:g('ft'),r:g('fr'),o:g('fo'),rb:g('frb')});if(!q)draw()}
function addSrv(){keep(true);const d=draft,rit=d.r===RIT[2]?(d.o||'Altro'):d.r;
if(!d.d||!d.vols.length)return alert('Inserisci data e almeno un volontario');
const o={id:d.id||Date.now(),d:d.d,from:d.from,to:d.to,place:d.p,ev:d.e,type:d.t,rit,vols:[...d.vols],rimb:+d.rb||0};
put(o);sel=d.d;month=new Date(+d.d.slice(0,4),+d.d.slice(5,7)-1,1);draft={vols:[]};draw()}
function editSrv(id){const s=S.srv.find(x=>x.id===id),alt=!RIT.slice(0,2).includes(s.rit);draft={id,d:s.d,from:s.from,to:s.to,p:s.place,e:s.ev,t:s.type,r:alt?RIT[2]:s.rit,o:alt?s.rit:'',rb:s.rimb||'',vols:[...s.vols]};draw();$('#frm').scrollIntoView()}
function wa(id){const s=S.srv.find(x=>x.id===id);open('https://wa.me/?text='+encodeURIComponent(`ANPS Milano – Servizio ${fmt(s.d)} ${s.from}-${s.to}\n${s.type}: ${s.ev||s.place}\nLuogo: ${s.place}\nRitrovo: ${s.rit}\nResponsabile: ${s.vols[0]}\nVolontari: ${s.vols.join(', ')}`))}
function delSrv(id){if(confirm('Eliminare il servizio?'))rm(id)}
let flt={v:'',t:'',from:Y+'-01-01',to:Y+'-12-31'};
const eur=n=>n.toFixed(2).replace('.',',')+' €',n2=n=>Math.round(n*100)/100;
function srows(){return S.srv.filter(s=>s.d>=flt.from&&s.d<=flt.to&&(!flt.t||s.type===flt.t)).sort((a,b)=>a.d.localeCompare(b.d)).flatMap(s=>s.vols.filter(v=>!flt.v||v===flt.v).map(v=>({s,v})))}
function agg(rows){const t={};rows.forEach(r=>{const x=t[r.v]||(t[r.v]={h:0,e:0});x.h=n2(x.h+hrs(r.s));x.e=n2(x.e+(r.s.rimb||0))});return Object.entries(t).sort((a,b)=>b[1].h-a[1].h)}
function csv(){const r=['Data;Volontario;Tipo;Ore;Rimborso;Luogo;Manifestazione;Ritrovo'].concat(srows().map(x=>[fmt(x.s.d),x.v,x.s.type,hrs(x.s),(x.s.rimb||0).toFixed(2).replace('.',','),x.s.place,x.s.ev,x.s.rit].join(';')));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r.join('\n')],{type:'text/csv'}));a.download='servizi.csv';a.click()}
async function pdf(){try{await lib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');await lib('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js')}catch(e){return alert('Impossibile caricare il modulo PDF (serve internet)')}
const rows=srows(),A=agg(rows),E=n=>'EUR '+n.toFixed(2).replace('.',','),d=new window.jspdf.jsPDF();
try{d.addImage(document.querySelector('header img').src,'PNG',14,10,16,22)}catch(e){}
d.setFontSize(15);d.text('ANPS Milano - Rendiconto servizi volontari',34,18);d.setFontSize(10);
d.text(`Periodo: ${fmt(flt.from)} - ${fmt(flt.to)}${flt.v?' | '+flt.v:''}${flt.t?' | '+flt.t:''}`,34,25);
const H=[10,47,107];d.autoTable({startY:36,head:[['Data','Volontario','Tipo','Ore','Rimborso','Luogo / Manifestazione']],headStyles:{fillColor:H},styles:{fontSize:8},
body:rows.map(r=>[fmt(r.s.d),r.v,r.s.type,hrs(r.s),E(r.s.rimb||0),r.s.place+(r.s.ev?' - '+r.s.ev:'')]),
foot:[['','','Totale',n2(A.reduce((a,x)=>a+x[1].h,0)),E(A.reduce((a,x)=>a+x[1].e,0)),'']],footStyles:{fillColor:H}});
d.autoTable({startY:d.lastAutoTable.finalY+8,head:[['Classifica','Volontario','Ore','Rimborso totale']],headStyles:{fillColor:H},body:A.map((x,i)=>[i+1,x[0],x[1].h,E(x[1].e)])});
d.save('rendiconto_anps.pdf')}
function stat(){const rows=srows(),A=agg(rows),max=A[0]?A[0][1].h||1:1,TH=n2(A.reduce((a,x)=>a+x[1].h,0)),TE=n2(A.reduce((a,x)=>a+x[1].e,0));
const byT={};TIPI.forEach(t=>byT[t]=0);rows.forEach(r=>byT[r.s.type]=n2((byT[r.s.type]||0)+hrs(r.s)));
const op=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
return `<div class="card fl"><select onchange="flt.v=this.value;draw()"><option value="">Tutti i volontari</option>${op(S.vol,flt.v)}</select>
<select onchange="flt.t=this.value;draw()"><option value="">Tutti i tipi</option>${op(TIPI,flt.t)}</select>
<label class="m">Dal <input type="date" value="${flt.from}" onchange="flt.from=this.value;draw()"></label><label class="m">al <input type="date" value="${flt.to}" onchange="flt.to=this.value;draw()"></label>
<button class="pri" onclick="pdf()">📄 PDF rendiconto</button><button onclick="csv()">⬇️ Excel (CSV)</button></div>
<div class="card"><h2>Totale periodo${flt.v?' – '+esc(flt.v):''}</h2><b style="font-size:20px">${TH} ore · rimborsi ${eur(TE)}</b><div class="m">dal ${fmt(flt.from)} al ${fmt(flt.to)}</div></div>
<div class="two"><div class="card"><h2>Classifica ore</h2>${A.map((r,i)=>`<div>${i+1}. ${esc(r[0])} — <b>${r[1].h} h</b> · ${eur(r[1].e)}<div class="bar" style="width:${r[1].h/max*100}%"></div></div>`).join('')||'<span class="m">Nessun dato.</span>'}</div>
<div class="card"><h2>Ore per tipo di servizio</h2>${Object.entries(byT).map(([t,h])=>`<div>${t}: <b>${h} h</b></div>`).join('')}</div></div>
<div class="card"><h2>Registro servizi</h2><div class="tw"><table><tr><th>Data</th><th>Volontario</th><th>Tipo</th><th>Ore</th><th>Rimborso</th><th>Luogo / Manifestazione</th></tr>
${rows.map(r=>`<tr><td>${fmt(r.s.d)}</td><td>${esc(r.v)}</td><td><select onchange="setT(${r.s.id},this.value)">${TIPI.map(t=>`<option ${t===r.s.type?'selected':''}>${t}</option>`).join('')}</select></td><td>${hrs(r.s)}</td><td>${eur(r.s.rimb||0)}</td><td>${esc(r.s.place)}${r.s.ev?' – '+esc(r.s.ev):''}</td></tr>`).join('')}</table></div></div>`}
function setT(id,t){put({...S.srv.find(s=>s.id===id),type:t})}
function volp(){return `<div class="card"><h2>Volontari</h2><input id="nv" placeholder="Cognome Nome"><button class="pri" onclick="addV()">Aggiungi</button>
<ul>${S.vol.map((v,i)=>`<li>${esc(v)} <button class="del" onclick="delV(${i})">✕</button></li>`).join('')}</ul></div>`}
function addV(){const v=$('#nv').value.trim();if(v&&!S.vol.includes(v))putV(v)}
function delV(i){if(confirm('Rimuovere il volontario?'))rmV(S.vol[i])}
const lib=u=>new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=j;document.head.appendChild(s)});
let beeped={};
function beep(n=3){try{const c=new(window.AudioContext||window.webkitAudioContext)();c.resume();for(let i=0;i<n;i++){const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(c.destination);o.start(c.currentTime+i*.4);o.stop(c.currentTime+i*.4+.2)}}catch(e){}}
function remind(){if(isAdm())return'';const t=new Date();t.setDate(t.getDate()+1);const tm=iso(t),L=S.srv.filter(s=>s.vols.includes(user)&&(s.d===tm||s.d===today));if(!L.length)return'';
const k=L.map(s=>s.id).join();if(!beeped[k]){beeped[k]=1;setTimeout(beep,300)}
return `<div class="card" style="border:2px solid var(--a)"><h2>🔔 Promemoria servizio <button onclick="beep()">🔊 Riascolta bip</button></h2>${L.map(s=>`<div><b>${s.d===today?'OGGI':'DOMANI'}</b> ${fmt(s.d)} · ${s.from}–${s.to} · ${esc(s.type)} · ${esc(s.place)} · Ritrovo: ${esc(s.rit)}</div>`).join('')}</div>`}
/* ===== Firebase / dati ===== */
const CFG=window.FIREBASE_CONFIG&&!/^INCOLLA/.test(window.FIREBASE_CONFIG.apiKey||'INCOLLA')?window.FIREBASE_CONFIG:null;
const ADMINS=(window.ADMIN_EMAILS||[]).map(x=>x.toLowerCase());
let db=null,auth=null,un=[];const vid=n=>n.replace(/\//g,'-');
function put(s){if(db)db.collection('servizi').doc(String(s.id)).set(s).catch(e=>alert(e.message));else{const i=S.srv.findIndex(x=>x.id===s.id);i<0?S.srv.push(s):S.srv[i]=s;save();draw()}}
function rm(id){if(db)db.collection('servizi').doc(String(id)).delete();else{S.srv=S.srv.filter(s=>s.id!==id);save();draw()}}
function putV(n){if(db)db.collection('volontari').doc(vid(n)).set({name:n});else{S.vol.push(n);S.vol.sort();save();draw()}}
function rmV(n){if(db)db.collection('volontari').doc(vid(n)).delete();else{S.vol=S.vol.filter(x=>x!==n);save();draw()}}
function out(){if(auth)auth.signOut();else{user=null;draw()}}
function login(){if(!CFG)return demoLogin();$('#who').innerHTML='';$('#app').innerHTML=`<div class="card login"><img src="${document.querySelector('header img').src}" height="110" alt="ANPS"><h2>Accesso</h2>
<input id="em" type="email" placeholder="Email"><br><br><input id="pw" type="password" placeholder="Password (min. 6 caratteri)"><br>
<button class="pri" onclick="au('in')">Accedi</button><button onclick="au('up')">Registrati</button><br><a href="#" onclick="au('rs');return false">Password dimenticata?</a>
<p class="m">Prima volta? Premi Registrati, poi scegli il tuo nominativo.</p></div>`}
async function au(m){const e=$('#em').value.trim(),p=$('#pw').value;try{if(m==='in')await auth.signInWithEmailAndPassword(e,p);else if(m==='up')await auth.createUserWithEmailAndPassword(e,p);else{await auth.sendPasswordResetEmail(e);alert('Ti ho inviato una email per reimpostare la password')}}catch(x){alert('Errore: '+x.message)}}
function pick(){$('#who').innerHTML='<button onclick="out()">Esci</button>';$('#app').innerHTML=`<div class="card login"><h2>Chi sei?</h2><p class="m">Scegli il tuo nominativo. Se non compare, chiedi all'amministratore di inserirti.</p><select id="pk"><option value="">—</option>${S.vol.map(v=>`<option>${esc(v)}</option>`).join('')}</select><button class="pri" onclick="pk()">Conferma</button></div>`}
async function pk(){const n=$('#pk').value;if(!n)return;await db.collection('users').doc(auth.currentUser.uid).set({name:n,email:auth.currentUser.email});user=n;draw()}
function listen(){un.forEach(f=>f());un=[db.collection('servizi').onSnapshot(q=>{if($('#frm'))keep(true);S.srv=q.docs.map(x=>x.data());draw()}),db.collection('volontari').onSnapshot(q=>{if($('#frm'))keep(true);S.vol=q.docs.map(x=>x.data().name).sort();draw()})]}
async function boot(){if(!CFG)return draw();
try{for(const u of ['app','auth','firestore'])await lib('https://www.gstatic.com/firebasejs/10.12.2/firebase-'+u+'-compat.js')}catch(e){return alert('Impossibile caricare Firebase')}
firebase.initializeApp(CFG);auth=firebase.auth();db=firebase.firestore();S={vol:[],srv:[]};
auth.onAuthStateChanged(async u=>{if(!u){un.forEach(f=>f());un=[];user=null;return draw()}
if(ADMINS.includes(u.email.toLowerCase()))user='__admin';else{const d=await db.collection('users').doc(u.uid).get();user=d.exists?d.data().name:'__pick'}
listen();draw()})}
const rbTxt=(r,n)=>(+r>0&&n)?`${n} volontari × ${eur(+r)} = totale servizio ${eur(+r*n)}`:'Lascia vuoto se non c\'è rimborso.';
function rbT(){$('#rbt').textContent=rbTxt($('#frb').value,draft.vols.length)}
boot();
</script></body></html>
